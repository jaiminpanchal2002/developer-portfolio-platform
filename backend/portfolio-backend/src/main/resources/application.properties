spring.application.name=portfolio-backend
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Adzuna job-search API credentials — supply via environment, never commit values.
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}

# Google Gemini — powers real resume/job-description comparison (job match
# scoring, ATS checker, resume review) and the chatbot. Get a free-tier key
# at aistudio.google.com/apikey. Supply via environment, never commit values.
# Without a key, every AI feature below falls back to a deterministic
# (non-LLM) result instead of failing.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# SMTP credentials — supply via environment, never commit values.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}

jaimin.meet.link=${MEET_LINK:}

# CORS — comma-separated list of exact frontend origins allowed to call this
# API. Override/extend via env for staging or preview deployments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://jaiminpanchal.com,https://www.jaiminpanchal.com,http://localhost:3000}

# Every account created via /api/auth/register gets admin access to this
# portfolio's CMS, so registration is gated behind this shared secret rather
# than left open to the internet. Leave unset to disable registration
# entirely (fail closed); set only when you actually need to create or
# recover an admin account, then unset again for max security.
app.registration.secret=${ADMIN_REGISTRATION_SECRET:}
